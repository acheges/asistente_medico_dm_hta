# Configuración de trytond (motor de GNU Health).
# Este archivo es una PLANTILLA: el entrypoint.sh sustituye las variables ${...}
# con los valores del entorno (.env) al arrancar el contenedor.

[database]
# Conexión a PostgreSQL. Se arma con las variables de entorno.
uri = postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST}:${DB_PORT}/
# Carpeta donde se guardan los adjuntos (documentos, imágenes).
path = /var/lib/gnuhealth/attach

[web]
# El servidor escucha en el puerto 8000 (se publica al exterior vía docker-compose).
listen = 0.0.0.0:8000
# Carpeta del cliente web Sao (lo instala el Dockerfile). trytond sirve la interfaz aquí:
# GET / devuelve la interfaz Sao; POST / atiende la API JSON-RPC.
root = /opt/gnuhealth/sao
